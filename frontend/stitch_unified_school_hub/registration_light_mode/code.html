  body { font-family: 'Inter', sans-serif; }

<style>
    body {

<body class="bg-surface text-on-surface min-h-screen flex items-center justify-center p-margin-mobile md:p-margin-desktop">
<main class="w-full max-w-[480px] bg-surface-container-lowest rounded-xl shadow-[0_4px_16px_rgba(0,32,69,0.15)] p-lg overflow-hidden relative">
<!-- Decorative top bar -->
<div class="absolute top-0 left-0 w-full h-xs bg-primary"></div>
<!-- Header -->
<div class="flex flex-col items-center mb-xl">
<div class="w-12 h-12 bg-primary-container rounded-full flex items-center justify-center mb-sm shadow-[0_4px_16px_rgba(0,32,69,0.2)]">
<span class="material-symbols-outlined text-on-primary-container text-[24px]">school</span>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-primary text-center">
        EduConnect
      </h1>
<p class="font-body-md text-body-md text-on-surface-variant text-center mt-xs">
        Create Account
      </p>
</div>
<!-- Registration Form -->
<form class="space-y-md">
<!-- Full Name -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-xs" for="fullName">Full Name</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-sm flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">person</span>
</div>
<input class="w-full pl-[40px] pr-sm py-sm bg-surface rounded-DEFAULT border border-outline-variant text-on-surface font-body-md focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-colors duration-200" id="fullName" name="fullName" placeholder="Jane Doe" required="" type="text"/>
</div>
</div>
<!-- Email Address -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-xs" for="email">Email Address</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-sm flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">mail</span>
</div>
<input class="w-full pl-[40px] pr-sm py-sm bg-surface rounded-DEFAULT border border-outline-variant text-on-surface font-body-md focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-colors duration-200" id="email" name="email" placeholder="jane@example.com" required="" type="email"/>
</div>
</div>
<!-- Role Dropdown -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-xs" for="role">Role</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-sm flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">badge</span>
</div>
<select class="w-full pl-[40px] pr-sm py-sm bg-surface rounded-DEFAULT border border-outline-variant text-on-surface font-body-md focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-colors duration-200 appearance-none" id="role" name="role" required="">
<option disabled="" selected="" value="">Select your role</option>
<option value="student">Student</option>
<option value="teacher">Teacher</option>
<option value="parent">Parent</option>
</select>
<div class="absolute inset-y-0 right-0 pr-sm flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">expand_more</span>
</div>
</div>
</div>
<!-- Create Password -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-xs" for="password">Create Password</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-sm flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">lock</span>
</div>
<input class="w-full pl-[40px] pr-sm py-sm bg-surface rounded-DEFAULT border border-outline-variant text-on-surface font-body-md focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-colors duration-200" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Terms & Conditions Checkbox -->
<div class="flex items-start pt-sm">
<div class="flex items-center h-5">
<input class="w-4 h-4 text-primary bg-surface border-outline-variant rounded focus:ring-primary focus:ring-2" id="terms" name="terms" required="" type="checkbox"/>
</div>
<div class="ml-sm text-sm">
<label class="font-body-md text-[14px] text-on-surface-variant" for="terms">
            I agree to the <a class="text-primary hover:underline font-medium" href="#">Terms &amp; Conditions</a>
</label>
</div>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary text-on-primary py-sm px-md rounded-lg font-label-md text-label-md shadow-[0_4px_16px_rgba(0,32,69,0.2)] hover:bg-primary-container hover:text-on-primary-container transition-all duration-200 active:scale-95 flex items-center justify-center mt-lg" type="submit">
        Register
      </button>
</form>
<!-- Footer Login Link -->
<div class="mt-lg text-center">
<p class="font-body-md text-[14px] text-on-surface-variant">
        Already have an account? <a class="text-primary hover:underline font-medium" href="#">Log in</a>
</p>
</div>
