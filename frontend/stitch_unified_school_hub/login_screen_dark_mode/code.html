<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>EduConnect - Secure Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "error": "#ba1a1a",
                        "surface-container-highest": "#d4e4fc",
                        "outline-variant": "#c4c6cf",
                        "surface-container-high": "#dce9ff",
                        "secondary-container": "#9ff5c1",
                        "primary-fixed-dim": "#adc7f7",
                        "primary": "#002045",
                        "outline": "#74777f",
                        "on-primary-container": "#86a0cd",
                        "primary-fixed": "#d6e3ff",
                        "on-error": "#ffffff",
                        "secondary-fixed-dim": "#83d8a6",
                        "surface-container-low": "#eff4ff",
                        "on-secondary-fixed-variant": "#005231",
                        "tertiary": "#3b1500",
                        "on-tertiary": "#ffffff",
                        "on-surface": "#0d1c2e",
                        "primary-container": "#1a365d",
                        "surface-dim": "#ccdbf4",
                        "on-secondary-container": "#167249",
                        "on-primary-fixed": "#001b3c",
                        "inverse-surface": "#223144",
                        "tertiary-fixed": "#ffdbca",
                        "surface-container": "#e5eeff",
                        "on-surface-variant": "#43474e",
                        "on-error-container": "#93000a",
                        "surface-container-lowest": "#ffffff",
                        "secondary": "#0a6c44",
                        "on-primary-fixed-variant": "#2d476f",
                        "inverse-primary": "#adc7f7",
                        "background": "#f8f9ff",
                        "surface": "#f8f9ff",
                        "surface-bright": "#f8f9ff",
                        "on-secondary-fixed": "#002111",
                        "surface-tint": "#455f88",
                        "on-tertiary-fixed": "#331100",
                        "inverse-on-surface": "#eaf1ff",
                        "tertiary-container": "#5d2500",
                        "on-tertiary-container": "#f57d32",
                        "secondary-fixed": "#9ff5c1",
                        "on-primary": "#ffffff",
                        "on-secondary": "#ffffff",
                        "on-background": "#0d1c2e",
                        "error-container": "#ffdad6",
                        "surface-variant": "#d4e4fc",
                        "tertiary-fixed-dim": "#ffb68f",
                        "on-tertiary-fixed-variant": "#773200"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "margin-desktop": "32px",
                        "margin-mobile": "16px",
                        "gutter": "16px",
                        "xl": "48px",
                        "xs": "4px",
                        "md": "16px",
                        "lg": "24px",
                        "sm": "8px",
                        "max-width": "1280px",
                        "base": "4px"
                    },
                    "fontFamily": {
                        "headline-lg-mobile": ["Inter"],
                        "body-lg": ["Inter"],
                        "label-md": ["Inter"],
                        "headline-lg": ["Inter"],
                        "body-md": ["Inter"],
                        "headline-md": ["Inter"],
                        "label-sm": ["Inter"]
                    },
                    "fontSize": {
                        "headline-lg-mobile": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "700" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "label-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0.02em", "fontWeight": "600" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "fontWeight": "500" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.fill {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface dark:bg-on-background text-on-surface dark:text-surface font-body-md min-h-screen flex items-center justify-center p-4">
<!-- Login Container -->
<main class="w-full max-w-md bg-surface-container-lowest dark:bg-inverse-surface rounded-xl shadow-[0_8px_32px_rgba(0,32,69,0.15)] dark:shadow-[0_8px_32px_rgba(0,0,0,0.5)] overflow-hidden">
<!-- Header -->
<div class="px-lg pt-xl pb-md text-center">
<div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-primary-container dark:bg-primary-fixed-dim text-on-primary-container dark:text-on-primary-fixed mb-4">
<span class="material-symbols-outlined text-4xl fill" data-icon="school">school</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-primary dark:text-primary-fixed mb-2">EduConnect</h1>
<p class="font-body-md text-body-md text-on-surface-variant dark:text-outline-variant">Sign in to your educational portal</p>
</div>
<!-- Form -->
<form class="px-lg pb-xl space-y-md">
<!-- Email/ID Field -->
<div>
<label class="block font-label-md text-label-md text-on-surface dark:text-surface-dim mb-xs" for="email">Email or Student ID</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 flex items-center pl-3 text-outline">
<span class="material-symbols-outlined" data-icon="person">person</span>
</span>
<input class="w-full pl-10 pr-4 py-3 bg-surface dark:bg-on-background border border-outline-variant dark:border-outline rounded-lg font-body-md text-body-md text-on-surface dark:text-surface focus:outline-none focus:border-primary dark:focus:border-primary-fixed focus:ring-1 focus:ring-primary dark:focus:ring-primary-fixed transition-colors" id="email" name="email" placeholder="Enter your credentials" type="text"/>
</div>
</div>
<!-- Password Field -->
<div>
<label class="block font-label-md text-label-md text-on-surface dark:text-surface-dim mb-xs" for="password">Password</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 flex items-center pl-3 text-outline">
<span class="material-symbols-outlined" data-icon="lock">lock</span>
</span>
<input class="w-full pl-10 pr-10 py-3 bg-surface dark:bg-on-background border border-outline-variant dark:border-outline rounded-lg font-body-md text-body-md text-on-surface dark:text-surface focus:outline-none focus:border-primary dark:focus:border-primary-fixed focus:ring-1 focus:ring-primary dark:focus:ring-primary-fixed transition-colors" id="password" name="password" placeholder="Enter your password" type="password"/>
<button class="absolute inset-y-0 right-0 flex items-center pr-3 text-outline hover:text-primary dark:hover:text-primary-fixed transition-colors" type="button">
<span class="material-symbols-outlined" data-icon="visibility_off">visibility_off</span>
</button>
</div>
<div class="mt-2 text-right">
<a class="font-label-sm text-label-sm text-primary dark:text-primary-fixed hover:underline" href="#">Forgot Password?</a>
</div>
</div>
<!-- Main Actions -->
<div class="pt-sm space-y-4">
<button class="w-full py-3 px-4 bg-primary dark:bg-primary-fixed text-on-primary dark:text-on-primary-fixed rounded-lg font-label-md text-label-md shadow-md hover:bg-primary-container dark:hover:bg-primary-fixed-dim transition-all active:scale-95 flex items-center justify-center gap-2" type="button">
                    Sign In
                    <span class="material-symbols-outlined" data-icon="login">login</span>
</button>
<div class="relative flex items-center py-2">
<div class="flex-grow border-t border-outline-variant/50 dark:border-outline/50"></div>
<span class="flex-shrink-0 mx-4 font-label-sm text-label-sm text-on-surface-variant dark:text-outline-variant">Or continue with</span>
<div class="flex-grow border-t border-outline-variant/50 dark:border-outline/50"></div>
</div>
<!-- Biometrics -->
<div class="flex gap-4">
<button class="flex-1 py-3 px-4 bg-surface dark:bg-on-background border border-outline-variant dark:border-outline rounded-lg font-label-md text-label-md text-on-surface dark:text-surface hover:bg-surface-variant/20 dark:hover:bg-inverse-surface/50 transition-colors flex items-center justify-center gap-2" type="button">
<span class="material-symbols-outlined text-xl" data-icon="fingerprint">fingerprint</span>
                        Touch ID
                    </button>
<button class="flex-1 py-3 px-4 bg-surface dark:bg-on-background border border-outline-variant dark:border-outline rounded-lg font-label-md text-label-md text-on-surface dark:text-surface hover:bg-surface-variant/20 dark:hover:bg-inverse-surface/50 transition-colors flex items-center justify-center gap-2" type="button">
<span class="material-symbols-outlined text-xl" data-icon="face">face</span>
                        Face ID
                    </button>
</div>
</div>
<!-- Registration Link -->
<div class="text-center pt-md">
<p class="font-body-md text-body-md text-on-surface-variant dark:text-outline-variant">
                    Don't have an account? 
                    <a class="font-label-md text-label-md text-primary dark:text-primary-fixed hover:underline ml-1" href="#">Register here</a>
</p>
</div>
</form>
</main>
</body></html>
