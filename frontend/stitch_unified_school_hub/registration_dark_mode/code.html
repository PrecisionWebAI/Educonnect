<style>
        body {
            /* Force dark mode background since the user asked for dark mode specifically in the prompt but the theme config defaults to light */
            background-color: #0d1c2e; 
            color: #ffffff;
        }
      </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="min-h-screen flex flex-col items-center justify-center p-margin-mobile md:p-margin-desktop bg-[#0d1c2e] text-[#ffffff]">
<!-- Main Registration Container -->
<div class="w-full max-w-md bg-[#223144] rounded-xl shadow-[0_8px_32px_rgba(0,32,69,0.3)] p-lg flex flex-col gap-lg overflow-hidden relative">
<!-- Header / Logo Area -->
<div class="flex flex-col items-center gap-sm mt-sm">
<div class="w-16 h-16 rounded-full bg-[#1a365d] flex items-center justify-center text-primary-fixed mb-sm shadow-[0_4px_16px_rgba(0,32,69,0.2)]">
<span class="material-symbols-outlined text-4xl" data-icon="school" style="font-variation-settings: 'FILL' 1;">school</span>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-primary md:font-headline-lg md:text-headline-lg">Create Account</h1>
<p class="font-body-md text-body-md text-on-surface-variant dark:text-[#adc7f7]">Join the EduConnect community.</p>
</div>
<!-- Form Area -->
<form class="flex flex-col gap-md">
<!-- Full Name Input -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-[#d6e3ff]" for="fullName">Full Name</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-md text-[#86a0cd]" data-icon="person">person</span>
<input class="w-full pl-xl pr-md py-sm bg-[#0d1c2e] border border-[#43474e] rounded-lg font-body-md text-body-md text-[#ffffff] placeholder:text-[#43474e] focus:border-[#d6e3ff] focus:ring-1 focus:ring-[#d6e3ff] transition-colors outline-none h-12" id="fullName" placeholder="Jane Doe" type="text"/>
</div>
</div>
<!-- Email Input -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-[#d6e3ff]" for="email">Email Address</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-md text-[#86a0cd]" data-icon="mail">mail</span>
<input class="w-full pl-xl pr-md py-sm bg-[#0d1c2e] border border-[#43474e] rounded-lg font-body-md text-body-md text-[#ffffff] placeholder:text-[#43474e] focus:border-[#d6e3ff] focus:ring-1 focus:ring-[#d6e3ff] transition-colors outline-none h-12" id="email" placeholder="jane@example.com" type="email"/>
</div>
</div>
<!-- Role Dropdown -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-[#d6e3ff]" for="role">Role</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-md text-[#86a0cd]" data-icon="badge">badge</span>
<select class="w-full pl-xl pr-md py-sm bg-[#0d1c2e] border border-[#43474e] rounded-lg font-body-md text-body-md text-[#ffffff] appearance-none focus:border-[#d6e3ff] focus:ring-1 focus:ring-[#d6e3ff] transition-colors outline-none h-12 cursor-pointer" id="role">
<option class="text-[#43474e]" disabled="" selected="" value="">Select your role</option>
<option value="student">Student</option>
<option value="parent">Parent</option>
<option value="teacher">Teacher</option>
</select>
<span class="material-symbols-outlined absolute right-md text-[#86a0cd] pointer-events-none" data-icon="expand_more">expand_more</span>
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-[#d6e3ff]" for="password">Create Password</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-md text-[#86a0cd]" data-icon="lock">lock</span>
<input class="w-full pl-xl pr-md py-sm bg-[#0d1c2e] border border-[#43474e] rounded-lg font-body-md text-body-md text-[#ffffff] placeholder:text-[#43474e] focus:border-[#d6e3ff] focus:ring-1 focus:ring-[#d6e3ff] transition-colors outline-none h-12" id="password" placeholder="••••••••" type="password"/>
</div>
</div>
<!-- Terms Checkbox -->
<div class="flex items-start gap-sm mt-sm">
<div class="flex items-center h-6">
<input class="w-4 h-4 rounded border-[#43474e] bg-[#0d1c2e] text-[#d6e3ff] focus:ring-[#d6e3ff] focus:ring-offset-[#223144] cursor-pointer" id="terms" type="checkbox"/>
</div>
<label class="font-body-md text-body-md text-[#adc7f7] cursor-pointer select-none" for="terms">
                    I agree to the <a class="text-[#d6e3ff] font-label-md text-label-md hover:underline" href="#">Terms and Conditions</a> and Privacy Policy.
                </label>
</div>
<!-- Submit Button -->
<button class="w-full mt-sm py-3 px-6 bg-[#d6e3ff] text-[#001b3c] font-label-md text-label-md rounded-lg shadow-[0_4px_16px_rgba(214,227,255,0.2)] hover:bg-[#adc7f7] transition-all duration-200 active:scale-95 flex justify-center items-center gap-sm" type="submit">
                Register
                <span class="material-symbols-outlined text-sm" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
<!-- Login Link -->
<div class="text-center mt-sm border-t border-[#43474e] pt-md">
<p class="font-body-md text-body-md text-[#adc7f7]">
                Already have an account? 
                <a class="text-[#d6e3ff] font-label-md text-label-md hover:underline ml-xs" href="#">Log in</a>
</p>
</div>
</div>
</body></html>
