<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>EduConnect Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "on-primary-fixed-variant": "#2d476f",
                      "surface-container-highest": "#d4e4fc",
                      "on-primary": "#ffffff",
                      "surface-bright": "#f8f9ff",
                      "surface": "#f8f9ff",
                      "surface-container-low": "#eff4ff",
                      "surface-container": "#e5eeff",
                      "on-error": "#ffffff",
                      "secondary-fixed-dim": "#83d8a6",
                      "surface-variant": "#d4e4fc",
                      "tertiary-fixed-dim": "#ffb68f",
                      "primary-fixed": "#d6e3ff",
                      "secondary": "#0a6c44",
                      "primary": "#002045",
                      "on-surface-variant": "#43474e",
                      "error": "#ba1a1a",
                      "on-primary-fixed": "#001b3c",
                      "surface-dim": "#ccdbf4",
                      "on-background": "#0d1c2e",
                      "inverse-on-surface": "#eaf1ff",
                      "on-secondary-container": "#167249",
                      "on-surface": "#0d1c2e",
                      "on-tertiary-fixed-variant": "#773200",
                      "secondary-fixed": "#9ff5c1",
                      "surface-tint": "#455f88",
                      "outline-variant": "#c4c6cf",
                      "primary-fixed-dim": "#adc7f7",
                      "outline": "#74777f",
                      "tertiary-fixed": "#ffdbca",
                      "primary-container": "#1a365d",
                      "on-secondary": "#ffffff",
                      "on-tertiary": "#ffffff",
                      "inverse-primary": "#adc7f7",
                      "on-error-container": "#93000a",
                      "error-container": "#ffdad6",
                      "inverse-surface": "#223144",
                      "on-primary-container": "#86a0cd",
                      "background": "#f8f9ff",
                      "surface-container-high": "#dce9ff",
                      "on-secondary-fixed-variant": "#005231",
                      "tertiary-container": "#5d2500",
                      "on-secondary-fixed": "#002111",
                      "tertiary": "#3b1500",
                      "secondary-container": "#9ff5c1",
                      "on-tertiary-fixed": "#331100",
                      "on-tertiary-container": "#f57d32",
                      "surface-container-lowest": "#ffffff"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "md": "16px",
                      "sm": "8px",
                      "xs": "4px",
                      "xl": "48px",
                      "lg": "24px",
                      "gutter": "16px",
                      "base": "4px",
                      "margin-mobile": "16px",
                      "max-width": "1280px",
                      "margin-desktop": "32px"
              },
              "fontFamily": {
                      "headline-lg-mobile": ["Inter"],
                      "headline-lg": ["Inter"],
                      "label-sm": ["Inter"],
                      "body-md": ["Inter"],
                      "headline-md": ["Inter"],
                      "label-md": ["Inter"],
                      "body-lg": ["Inter"]
              },
              "fontSize": {
                      "headline-lg-mobile": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "700"}],
                      "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                      "label-sm": ["12px", {"lineHeight": "16px", "fontWeight": "500"}],
                      "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                      "headline-md": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                      "label-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0.02em", "fontWeight": "600"}],
                      "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}]
              }
            }
          }
        }
    </script>
<style>
        .shadow-level-1 {
            box-shadow: 0 2px 8px rgba(0, 32, 69, 0.15);
        }
        .shadow-level-2 {
            box-shadow: 0 4px 16px rgba(0, 32, 69, 0.20);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface font-body-md min-h-screen flex items-center justify-center p-margin-mobile md:p-margin-desktop antialiased">
<!-- Login Container -->
<main class="w-full max-w-md bg-surface-container-lowest rounded-xl shadow-level-1 overflow-hidden flex flex-col items-center p-lg relative z-10">
<!-- Header / Logo -->
<header class="w-full flex flex-col items-center justify-center mb-xl pt-md text-center">
<div class="w-16 h-16 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center mb-md shadow-sm">
<span class="material-symbols-outlined text-[32px]" style="font-variation-settings: 'FILL' 1;">school</span>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-primary tracking-tight">EduConnect</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-sm">Welcome back! Please enter your details.</p>
</header>
<!-- Login Form -->
<form action="#" class="w-full flex flex-col gap-lg" method="POST">
<!-- Email / Student ID Input -->
<div class="flex flex-col gap-xs relative">
<label class="font-label-md text-label-md text-on-surface" for="identifier">Email or Student ID</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-outline-variant pointer-events-none">person</span>
<input class="w-full h-12 pl-[48px] pr-md rounded-lg border border-outline-variant bg-surface-bright text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-colors font-body-md text-body-md placeholder:text-outline placeholder:font-body-md placeholder:text-body-md" id="identifier" name="identifier" placeholder="Enter your email or ID" type="text"/>
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface" for="password">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-outline-variant pointer-events-none">lock</span>
<input class="w-full h-12 pl-[48px] pr-[48px] rounded-lg border border-outline-variant bg-surface-bright text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-colors font-body-md text-body-md placeholder:text-outline placeholder:font-body-md placeholder:text-body-md" id="password" name="password" placeholder="••••••••" type="password"/>
<button class="absolute right-md top-1/2 -translate-y-1/2 text-outline-variant hover:text-primary transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined">visibility_off</span>
</button>
</div>
<div class="flex justify-end mt-xs">
<a class="font-label-sm text-label-sm text-primary hover:text-on-primary-fixed-variant hover:underline transition-all" href="#">Forgot Password?</a>
</div>
</div>
<!-- Sign In Button -->
<button class="w-full h-12 rounded-lg bg-primary text-on-primary font-label-md text-label-md flex items-center justify-center gap-sm shadow-level-2 hover:bg-on-primary-fixed-variant transition-all active:scale-95 mt-sm" type="submit">
                Sign In
                <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
<!-- Divider -->
<div class="relative flex items-center justify-center my-md">
<div aria-hidden="true" class="absolute inset-0 flex items-center">
<div class="w-full border-t border-outline-variant/30"></div>
</div>
<div class="relative bg-surface-container-lowest px-md font-label-sm text-label-sm text-outline">
                    Or continue with
                </div>
</div>
<!-- Social/Biometric Login Options -->
<div class="flex gap-md w-full justify-center">
<button class="flex-1 h-12 rounded-lg border border-outline-variant/50 bg-surface flex items-center justify-center gap-sm hover:bg-surface-variant/30 transition-colors focus:ring-2 focus:ring-primary focus:outline-none" type="button">
<span class="material-symbols-outlined text-primary">fingerprint</span>
<span class="font-label-md text-label-md text-on-surface hidden md:block">Touch ID</span>
</button>
<button class="flex-1 h-12 rounded-lg border border-outline-variant/50 bg-surface flex items-center justify-center gap-sm hover:bg-surface-variant/30 transition-colors focus:ring-2 focus:ring-primary focus:outline-none" type="button">
<span class="material-symbols-outlined text-primary">face</span>
<span class="font-label-md text-label-md text-on-surface hidden md:block">Face ID</span>
</button>
</div>
</form>
<!-- Footer -->
<footer class="mt-xl pt-lg w-full text-center border-t border-outline-variant/20">
<p class="font-body-md text-body-md text-on-surface-variant">
                Don't have an account? 
                <a class="font-label-md text-label-md text-primary hover:underline hover:text-on-primary-fixed-variant transition-colors ml-xs" href="#">Register here</a>
</p>
</footer>
</main>
<!-- Background Decoration -->
<div aria-hidden="true" class="fixed inset-0 pointer-events-none z-0 overflow-hidden">
<div class="absolute top-[-10%] right-[-5%] w-96 h-96 bg-primary-fixed-dim/20 rounded-full blur-3xl"></div>
<div class="absolute bottom-[-10%] left-[-5%] w-[500px] h-[500px] bg-surface-container-high/40 rounded-full blur-3xl"></div>
</div>
</body></html>
