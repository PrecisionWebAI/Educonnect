<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>EduConnect Startup Screen</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet"/>

                        "on-error": "#ffffff",
                        "secondary-fixed-dim": "#83d8a6",
                        "surface-container-low": "#eff4ff",
                        "on-secondary-fixed-variant": "#005231",
                        "tertiary": "#3b1500",
                        "on-tertiary": "#ffffff",
                        "on-surface": "#0d1c2e",
                        "primary-container": "#1a365d",
                        "surface-dim": "#ccdbf4",
                        "on-secondary-container": "#167249",
                        "on-primary-fixed": "#001b3c",

                        "on-secondary": "#ffffff",

                        "error-container": "#ffdad6",

                        "lg": "24px",

                        "base": "4px"

                    "fontFamily": {

                    "fontSize": {

<style>
        .glow-effect {
            box-shadow: 0 0 60px 20px rgba(173, 199, 247, 0.15);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-primary text-on-primary min-h-screen flex flex-col items-center justify-center font-sans overflow-hidden relative">
<!-- Decorative background elements -->
<div class="absolute inset-0 overflow-hidden pointer-events-none">
<div class="absolute top-[-10%] left-[-10%] w-96 h-96 bg-primary-container rounded-full mix-blend-screen filter blur-[100px] opacity-50"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[500px] h-[500px] bg-secondary-container rounded-full mix-blend-screen filter blur-[120px] opacity-10"></div>
</div>
<!-- Main Content Container -->
<div class="z-10 flex flex-col items-center justify-center px-margin-mobile md:px-margin-desktop text-center max-w-md w-full animate-fade-in-up">
<!-- Logo Area with Glow -->
<div class="relative mb-xl flex items-center justify-center">
<div class="absolute inset-0 bg-primary-fixed-dim rounded-full glow-effect blur-xl opacity-50 animate-pulse"></div>
<div class="relative z-10 w-32 h-32 bg-surface-container-highest rounded-full flex items-center justify-center shadow-lg transform transition-transform hover:scale-105 duration-300">
<span class="material-symbols-outlined text-[64px] text-primary" data-icon="school" style="font-variation-settings: 'FILL' 1;">school</span>
</div>
</div>
<!-- Typography -->
<div class="mb-xl">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-primary-fixed mb-sm tracking-tight">EduConnect</h1>
<p class="font-body-lg text-body-lg text-primary-fixed-dim opacity-90">Connecting Schools, Empowering Students</p>
</div>
<!-- Call to Action -->
<div class="w-full mt-lg">
<button class="w-full py-4 bg-secondary text-on-secondary rounded-lg font-label-md text-label-md shadow-[0_4px_16px_rgba(10,108,68,0.2)] hover:bg-secondary-fixed hover:text-on-secondary-fixed hover:shadow-[0_6px_24px_rgba(159,245,193,0.3)] transition-all duration-300 transform active:scale-95 flex items-center justify-center gap-2 group">
<span>Get Started</span>
<span class="material-symbols-outlined transition-transform group-hover:translate-x-1" data-icon="arrow_forward">arrow_forward</span>
</button>
<p class="mt-md font-label-sm text-label-sm text-on-primary-container">
                Already have an account? <a class="text-secondary-fixed-dim hover:text-secondary-fixed underline decoration-secondary-fixed/30 hover:decoration-secondary-fixed transition-colors" href="#">Log in</a>
</p>
</div>
</div>
<!-- Minimalist footer indicator -->
<div class="absolute bottom-margin-mobile flex justify-center w-full z-10">
<div class="w-12 h-1 bg-outline-variant/30 rounded-full"></div>
</div>
