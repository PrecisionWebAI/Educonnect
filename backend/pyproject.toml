# ============================================================================
# Educonnect — backend (FastAPI + uv)
# Project metadata + Ruff lint/format config (the uv-native Python linter).
# ============================================================================

[project]
name = "educonnect-backend"
version = "0.1.0"
description = "Educonnect / EduVerse school automation backend (FastAPI)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0.0",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0.0",
]
[tool.uv]
# uv-specific project settings (if needed in future)

[tool.ruff]
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # assert in tests