# ============================================================================
# Educonnect — backend (FastAPI + uv)
# Project metadata + Ruff lint/format config (the uv-native Python linter).
# ============================================================================

[project]
name = "educonnect-backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.19.1",
    "bcrypt<4.1.0",
    "fastapi[standard]>=0.141.1",
    "passlib[bcrypt]>=1.7.4",
    "psycopg2-binary>=2.9.12",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.13.0",
    "sqlmodel>=0.0.39",
]

[dependency-groups]
dev = ["pre-commit>=4.6.2", "ruff>=0.16.4"]

[tool.ruff]
target-version = "py314"
line-length = 88
exclude = [".git", ".venv", "__pycache__", "alembic/versions"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
    "RUF", # Ruff-specific rules
]
ignore = [
    "B008", # Do not perform function calls in argument defaults (standard in FastAPI Depends)
    "ARG001", # Unused function arguments (common for FastAPI dependencies)
    "E501", # Line too long
    "E711", # Comparison to None (used in SQLAlchemy queries)
    "B904", # raise from err
    "RUF006", # Store asyncio.create_task ref
    "SIM105", # try-except-pass
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
"alembic/*" = ["F401", "E501"]
"__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
