# ===========================================================================
# Educonnect — full backend stack (FastAPI + PostgreSQL)
#
# Usage (from the repo root):
#   docker compose up --build        # start in foreground
#   docker compose up --build -d     # start in background
#   docker compose down              # stop the stack
#
# This is the SINGLE Docker Compose file for the stack — the backend image is
# built from backend/Dockerfile (build context below). DB/auth credentials are
# resolved from the git-ignored `backend/.env` (falling back to the defaults
# below), and port overrides come from a root `.env` (see `.env.example`).
# ===========================================================================

name: educonnect

services:
  db:
    image: postgres:16-alpine
    container_name: eduverse-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:?DB_USER is not set - put it in backend/.env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is not set - put it in backend/.env}
      POSTGRES_DB: ${DB_NAME:?DB_NAME is not set - put it in backend/.env}
    ports:
      # Host-side port for PostgreSQL. Uses the dedicated PG_HOST_PORT var so
      # backend/.env's DB_PORT (used by local `make dev`) does NOT control the
      # Docker mapping. Set PG_HOST_PORT=5433 if your machine already runs PG
      # on 5432. Inside the compose network PostgreSQL always listens on 5432.
      - "${PG_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eduverse-backend
    restart: unless-stopped
    # The whole of `backend/.env` reaches the container, so a new setting is added
    # there (and to `.env-example`) once - it is never duplicated here. Compose
    # itself reads the same file for the `environment:` interpolation below,
    # because the compose project directory is `backend/`.
    env_file:
      - .env
    environment:
      # DB_USER / DB_PASSWORD / DB_NAME / SECRET_KEY and the LLM settings all come
      # from `env_file` above - they are never repeated here.
      # Inside the compose network the database is the `db` service - `DB_HOST` in
      # `.env` is "localhost" because it describes a host run. `environment:` wins
      # over `env_file:`, so these two overrides are what the container sees.
      DB_HOST: ${DB_HOST_DOCKER:-db}
      # Inside the compose network PostgreSQL ALWAYS listens on 5432 - never
      # interpolate DB_PORT (that one is the host-side mapping).
      DB_PORT: ${DB_PORT_DOCKER:-5432}
      # DB_WAIT_SECONDS: how long docker-entrypoint.sh waits for PostgreSQL before starting
      # anyway (compose already gates on the db healthcheck - this is the
      # safety net for slow first boots).
      DB_WAIT_SECONDS: ${DB_WAIT_SECONDS:-60}
      # Demo data: on startup the backend fills both schools with a full roll -
      # students through the **admission form** (so their logins, guardians and
      # class-sections are created by the same code the screen uses) and teachers
      # through the **hire form**. It runs every start and only inserts what is
      # missing, so restarts are cheap. Set to 0 for a database with no demo rows.
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-1}
      # Fail fast: no placeholder default. `:?` stops `docker compose up` with
      # this message when `backend/.env` is missing or still says "change-me".
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is not set - put it in backend/.env}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      # ---- LLM (Ollama host par chalta hai, container ke andar nahi) ----
      # Container ke andar "localhost" = container khud, so `.env`'s host URL is
      # replaced by this one; everything else about the LLM comes from `env_file`.
      # host.docker.internal is mapped below in extra_hosts.
      LLM_BASE_URL: ${LLM_BASE_URL_DOCKER:-http://host.docker.internal:11434/v1}
    ports:
      - "${API_PORT:-8000}:8000"
    extra_hosts:
      # Linux par Docker host ko is naam se expose karta hai; Mac/Windows par
      # host.docker.internal pehle se hota hai — dono ke liye ye safe hai.
      - "host.docker.internal:host-gateway"
    volumes:
      
      - qdrant_local_data:/app/.qdrant_local
      - uploads_data:/app/.uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - 'python -c "import urllib.request; urllib.request.urlopen(''http://127.0.0.1:8000/health'', timeout=3)"'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
    name: eduverse_postgres_data
  # RAG local-mode vectors (Qdrant embedded) + uploaded source files.
  qdrant_local_data:
    name: eduverse_qdrant_local
  uploads_data:
    name: eduverse_uploads
