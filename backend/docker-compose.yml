# ===========================================================================
# Educonnect — backend stack (FastAPI + the Supabase Postgres)
#
# Usage (from the repo root):
#   docker compose up --build        # start in foreground
#   docker compose up --build -d     # start in background
#   docker compose down              # stop the stack
#
# There is NO database container here: the database is the Supabase project
# named by `DATABASE_URL_OVERRIDE` in the git-ignored `backend/.env`, so the
# container and a host `make dev` see exactly the same rows. Port overrides come
# from a root `.env` (see `.env.example`).
# ===========================================================================

name: educonnect

services:
  # The database used to be a `db` service here. It is not: Supabase hosts it,
  # and DATABASE_URL_OVERRIDE (from `backend/.env`) says which project. Nothing
  # in this file may reintroduce a local Postgres, or the two would diverge again.
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eduverse-backend
    restart: unless-stopped
    # The whole of `backend/.env` reaches the container, so a new setting is added
    # there (and to `.env-example`) once - it is never duplicated here. Compose
    # itself reads the same file for the `environment:` interpolation below,
    # because the compose project directory is `backend/`.
    env_file:
      - .env
    environment:
      # The DSN, the SECRET_KEY and the LLM settings all come from `env_file`
      # above - they are never repeated here. There is no DB_HOST/DB_PORT
      # override any more: the database sits outside the compose network, so
      # `backend/.env` describes it completely.
      # DB_WAIT_SECONDS: how long docker-entrypoint.sh waits for the managed
      # database before starting anyway. Supabase is usually up; this is the
      # safety net for a cold pooler or a dead network.
      DB_WAIT_SECONDS: ${DB_WAIT_SECONDS:-60}
      # Fail fast: no placeholder default. `:?` stops `docker compose up` with
      # this message when `backend/.env` is missing or still says "change-me".
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is not set - put it in backend/.env}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      # ---- LLM (Ollama host par chalta hai, container ke andar nahi) ----
      # Container ke andar "localhost" = container khud, so `.env`'s host URL is
      # replaced by this one; everything else about the LLM comes from `env_file`.
      # host.docker.internal is mapped below in extra_hosts.
      LLM_BASE_URL: ${LLM_BASE_URL_DOCKER:-http://host.docker.internal:11434/v1}
    ports:
      - "${API_PORT:-8000}:8000"
    extra_hosts:
      # Linux par Docker host ko is naam se expose karta hai; Mac/Windows par
      # host.docker.internal pehle se hota hai — dono ke liye ye safe hai.
      - "host.docker.internal:host-gateway"
    volumes:
      - qdrant_local_data:/app/.qdrant_local
      - uploads_data:/app/.uploads
    healthcheck:
      test:
        - CMD-SHELL
        - 'python -c "import urllib.request; urllib.request.urlopen(''http://127.0.0.1:8000/health'', timeout=3)"'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  # RAG local-mode vectors (Qdrant embedded) + uploaded source files.
  qdrant_local_data:
    name: eduverse_qdrant_local
  uploads_data:
    name: eduverse_uploads
