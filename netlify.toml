# ============================================================
# Netlify build config — EduConnect
# App (Next.js) frontend/ folder me hai, isliye base yahi set
# karna zaroori hai warna Netlify root me package.json phase
# aur build fail kar deta hai.
# ============================================================

[build]
  base = "frontend"
  command = "yarn build"
  publish = ".next"

# Next.js 16 ko Node >= 20.9 chahiye; 22 LTS use karte hain —
# @netlify/plugin-nextjs ka Next-16 support bhi 22 par sabse solid hai.
[build.environment]
  NODE_VERSION = "22"

# Next.js runtime plugin explicitly pin — warna Netlify purana cached
# plugin use kar sakta hai jo Next 16 ke saath fail hota hai.
[[plugins]]
  package = "@netlify/plugin-nextjs"