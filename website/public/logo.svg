<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Midnight Navy Gradient for 'C' -->
    <linearGradient id="gradC" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D4A8A" />
      <stop offset="45%" stop-color="#1B2F5C" />
      <stop offset="85%" stop-color="#131E3A" />
      <stop offset="100%" stop-color="#0B1221" />
    </linearGradient>

    <!-- Antique Gold Gradient for 'E' (#99753a) -->
    <linearGradient id="gradE" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#dfba7a" />
      <stop offset="40%" stop-color="#b88e4c" />
      <stop offset="80%" stop-color="#99753a" />
      <stop offset="100%" stop-color="#7a5823" />
    </linearGradient>
  </defs>

  <!-- The C (Background layer) - Midnight Navy -->
  <path
    d="M 145 65 A 40 40 0 1 0 145 135"
    fill="none"
    stroke="url(#gradC)"
    stroke-width="26"
    stroke-linecap="round"
  />

  <!-- The E (Foreground layer, interlocking) - Antique Gold -->
  <path
    d="M 105 60
       L 55 60
       A 10 10 0 0 0 45 70
       L 45 130
       A 10 10 0 0 0 55 140
       L 105 140
       M 45 100
       L 95 100"
    fill="none"
    stroke="url(#gradE)"
    stroke-width="26"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
